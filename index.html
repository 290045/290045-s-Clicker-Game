<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>290045's Blackhole Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated space background container -->
  <div class="space-bg"></div>

  <!-- Settings Trigger Button Top Left -->
  <button id="settings-toggle-btn" class="settings-toggle">⚙️ Settings</button>

  <!-- Shop Trigger Button Top Right -->
  <button id="shop-toggle-btn" class="shop-toggle">🌌 Open Shop</button>

  <!-- Slide-out Settings Menu Container -->
  <div id="settings-menu" class="settings-menu">
    <button id="settings-close-btn" class="settings-close">✕ Close</button>
    <h2>System Settings</h2>
    <div class="settings-section">
      <h3>Quantum Codes</h3>
      <div class="code-input-container">
        <input type="text" id="promo-code-input" placeholder="ENTER CODE..." autocomplete="off">
        <button id="promo-code-btn">SUBMIT</button>
      </div>
      <p id="code-message" class="code-msg"></p>
    </div>
    <div class="settings-section">
      <h3>Game Controls</h3>
      <button id="hard-reset-btn" class="reset-btn">☢️ Collapse Reality (Hard Reset)</button>
      <p class="settings-warn">Warning: This will permanently delete your Dark Matter and all purchased upgrades!</p>
    </div>
  </div>

  <!-- Slide-out Shop Menu Container -->
  <div id="shop-menu" class="shop-menu">
    <button id="shop-close-btn" class="shop-close">✕ Close</button>
    <h2>Cosmic Shop</h2>
    <div class="shop-section">
      <h3>Manual Upgrades</h3>
      <div id="manual-upgrades-container"></div>
    </div>
    <div class="shop-section">
      <h3>Automated Upgrades</h3>
      <div id="automated-upgrades-container"></div>
    </div>
  </div>

  <!-- Master Screen Center Anchor Wrapper -->
  <div class="screen-center-wrapper">
    <div class="game-container">
      <div class="counter-box">
        <span class="label">DARK MATTER</span>
        <h1 id="score">0</h1>
        <span id="pps-display" class="sub-label">0 per second</span>
      </div>
      <div id="click-btn-container">
        <div id="click-btn" class="css-black-hole">
          <div class="singularity-core"></div>
          <div class="accretion-disk"></div>
          <div class="gravitational-lens"></div>
          <div class="cinematic-disk-warp"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
